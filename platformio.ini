; platformio.ini - minimal snippet for building Marlin bugfix-2.1.x
[platformio]
default_envs = STM32F103RE_creality

; Example env for many Creality 4.2.x (STM32F103)
[env:STM32F103RE_creality]
platform = ststm32
board = genericSTM32F103RE
framework = arduino
build_flags =
  -DSTM32F1xx
  -DMCU_STM32F103xE

; If your board uses GD32F303 and the above env fails, try this env (community approach) 
; NOTE: GD32 may require custom board json or community patches; use only if you know GD32 is supported in your build.
[env:GD32F303RC_generic]
platform = ststm32
board = genericSTM32F103RC
framework = arduino
build_flags =
  -DSTM32F1xx
  -DMCU_STM32F103xC
