name: Build Firmware

on:
  workflow_dispatch:
  push:
    branches: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4    # versi terbaru

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.11

    - name: Install PlatformIO
      run: pip install platformio

    - name: Build Marlin
      working-directory: ./Marlin   # <<< INI SOLUSI INTINYA
      run: |
        echo "Building in $(pwd)"
        ls -lah
        platformio run -e STM32F103RET_creality
