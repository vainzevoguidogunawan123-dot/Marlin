name: Build Firmware

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install PlatformIO
      run: pip install platformio

    - name: Build Marlin Firmware
      run: platformio run -e STM32F103RET_creality

