[platformio]
default_envs = STM32F103RET_creality

[env:STM32F103RET_creality]
platform      = ststm32
board         = genericSTM32F103RE
board_build.core = stm32
build_flags   = -DSTM32F103xE -DARDUINO_ARCH_STM32
extra_scripts = Marlin/src/HAL/STM32F1/extra_script.py
src_filter    = +<Marlin/>
lib_deps      = 
   U8glib-HAL=https://github.com/MarlinFirmware/U8glib-HAL/archive/bugfix.zip

monitor_speed = 115200
upload_protocol = dfu

