name: Build Firmware

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Locate Marlin folder
      run: |
        echo "PWD:"
        pwd
        echo "---"
        echo "List:"
        ls -R .

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install PlatformIO
      run: pip install platformio

    - name: Build Marlin
      working-directory: .
      run: platformio run -e STM32F103RET_creality
