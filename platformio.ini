; PlatformIO Project Configuration File
; Compatible with Marlin 2.1.3
; Target board: Creality V4.2.2 (GD32F303RET6)

[platformio]
src_dir      = Marlin
boards_dir   = buildroot/share/PlatformIO/boards
env_default  = STM32F103RE_creality

; ===============================================
; Default Environment (GD32F303RET6 / V4.2.2)
; ===============================================

[env:STM32F103RE_creality]
platform      = ststm32@~14.0.0
board         = STM32F103RE_creality
framework     = arduino
build_flags   = 
  -DMCU_STM32F103RE
  -DGD32F303RE
  -DARDUINO_ARCH_STM32
  -DTIMER_SERVO_DISABLED
  -DENABLE_HWSERIAL2
  -Os
  -ffunction-sections
  -fdata-sections

upload_protocol = stlink

monitor_speed = 115200

lib_deps =
  U8glib-HAL=https://github.com/MarlinFirmware/U8glib-HAL/archive/bugfix.zip
  LiquidCrystal
  TMCStepper@>=0.7.1,<1.0.0
  Adafruit Unified Sensor
  Adafruit ADXL345
  src_filter=+<src/*>

; Optional for BLTouch servo pin
extra_scripts = 
  pre:buildroot/share/scripts/engage_hardware.py

; ================================================
; Enable these if you want USB upload (rarely used)
; ================================================
; upload_protocol = serial
; upload_port = /dev/ttyUSB0
