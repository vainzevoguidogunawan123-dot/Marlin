name: Build Marlin Firmware (GD32F303RET6)

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install PlatformIO
        run: |
          pip install -U platformio

      - name: Prepare Marlin Environment
        run: |
          pio pkg install -g --platform ststm32
          pio pkg install -g --platform ststm32@~15.5.0
          pio pkg install -g --toolchain gcc-arm-none-eabi
        continue-on-error: true

      - name: Build Firmware
        run: |
          platformio run -e STM32F103RE_creality
        working-directory: .

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-gd32-422
          path: |
            .pio/build/STM32F103RE_creality/firmware.bin
            .pio/build/STM32F103RE_creality/firmware.elf
            .pio/build/STM32F103RE_creality/firmware.map
          if-no-files-found: warn
