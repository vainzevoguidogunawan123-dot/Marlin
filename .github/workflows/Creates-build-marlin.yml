name: Build Marlin Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ---------------------------------------------
    #  FIX src/ AS PROXY (TIDAK MEMINDAH FILE MARLIN)
    # ---------------------------------------------
    - name: Create src proxy file
      run: |
        mkdir -p src
        echo '#include "../Marlin/src/MarlinCore.cpp"' > src/Marlin.cpp

    # ---------------------------------------------
    #  INSTALL PLATFORMIO
    # ---------------------------------------------
    - name: Install PlatformIO
      run: pip install -U platformio

    # ---------------------------------------------
    #  CLEAN BUILD CACHE
    # ---------------------------------------------
    - name: Clean PIO cache
      run: rm -rf .pio

    # ---------------------------------------------
    #  BUILD
    # ---------------------------------------------
    - name: Build firmware
      run: platformio run -e STM32F103RET_creality

    # ---------------------------------------------
    #  ARTIFACT OUTPUT
    # ---------------------------------------------
    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: firmware-bin
        path: .pio/build/STM32F103RET_creality/firmware.bin

