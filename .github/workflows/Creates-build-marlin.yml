name: Build Marlin Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    # ---------------------------------------------
    #  FIX FOLDER STRUCTURE
    # ---------------------------------------------
    - name: Fix Marlin Folder Structure
      run: |
        rm -rf src
        mkdir -p src
        cp -r Marlin/* src/

    # ---------------------------------------------
    #  CLEAN PIO BUILD CACHE
    # ---------------------------------------------
    - name: Remove .pio Folder
      run: |
        rm -rf .pio

    # ---------------------------------------------
    #  INSTALL PLATFORMIO
    # ---------------------------------------------
    - name: Install PlatformIO
      run: |
        pip install -U platformio

    # ---------------------------------------------
    #  BUILD
    # ---------------------------------------------
    - name: Build Firmware (Ender 3 Pro – 4.2.2 GD32F303)
      run: |
        platformio run -e STM32F103RET_creality

    # ---------------------------------------------
    #  UPLOAD ARTIFACT (v4)
    # ---------------------------------------------
    - name: Upload Firmware
      uses: actions/upload-artifact@v4
      with:
        name: firmware-bin
        path: .pio/build/STM32F103RET_creality/firmware.bin
