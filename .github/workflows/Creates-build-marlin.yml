name: Build Firmware

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout (with submodules)
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install PlatformIO
      run: pip install platformio

    - name: Build Marlin
      working-directory: ./  # pastikan di root repo yg ada platformio.ini
      run: platformio run -e STM32F103RET_creality
